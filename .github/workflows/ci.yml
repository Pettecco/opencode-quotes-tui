name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run build
      - name: Smoke test
        run: node -e "import('./dist/tui.js').then(m=>{const d=m.default; if(!d||d.id!=='quotes'||typeof d.tui!=='function'){throw new Error('bad plugin module');}; console.log('SMOKE OK')}).catch(e=>{console.error(e);process.exit(1)})"
